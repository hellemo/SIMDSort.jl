# The tests on Julia 1.10 (the oldest supported) and the current release, on
# x86-64 Linux (the AVX2 or AVX-512 code paths, as the runner's CPU has), with
# SIMD.jl's portable lowering (SIMD_JL_GENERIC=1), and on Apple silicon (ARM,
# not yet supported: experimental, its failures do not fail the workflow).
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }}, ${{ matrix.os }}${{ matrix.generic && ', generic lowering' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10', os: ubuntu-latest}
          - {version: '1', os: ubuntu-latest}
          - {version: '1', os: ubuntu-latest, generic: true}
          - {version: '1', os: macos-latest, experimental: true}
    env:
      JULIA_NUM_THREADS: 4
      SIMD_JL_GENERIC: ${{ matrix.generic && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Julia 1.10 ignores [sources]: add the SIMD.jl fork (README) explicitly.
      - name: SIMD.jl fork for Julia 1.10
        if: matrix.version == '1.10'
        run: julia --project -e 'using Pkg; Pkg.add(url = "https://github.com/hellemo/SIMD.jl", rev = "permute-compress")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
