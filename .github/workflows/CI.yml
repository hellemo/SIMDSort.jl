# The tests on Julia 1.10 (the oldest supported) and the current release, on
# x86-64 Linux (the AVX2 or AVX-512 code paths, as the runner's CPU has), with
# SIMD.jl's portable lowering (SIMD_JL_GENERIC=1), on Apple silicon (ARM:
# the portable lowering, checked for correctness only, not tuned), and on the
# next Julia release (experimental).
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }}, ${{ matrix.os }}${{ matrix.generic && ', generic lowering' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.10', os: ubuntu-latest}
          - {version: '1', os: ubuntu-latest}
          - {version: '1', os: ubuntu-latest, generic: true}
          - {version: '1', os: macos-latest}
          # the next release (prerelease): experimental, its failures do not fail the workflow
          - {version: 'pre', os: ubuntu-latest}
    env:
      JULIA_NUM_THREADS: 4
      SIMD_JL_GENERIC: ${{ matrix.generic && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Julia 1.10 ignores [sources]: add the SIMD.jl fork (README) explicitly.
      - name: SIMD.jl fork for Julia 1.10
        if: matrix.version == '1.10'
        run: julia --project -e 'using Pkg; Pkg.add(url = "https://github.com/hellemo/SIMD.jl", rev = "permute-compress")'
      # DoubleFloats' dependency GenericLinearAlgebra does not precompile on
      # Julia 1.14 (it overwrites a LinearAlgebra method), which would stop the
      # test run: drop it from the test dependencies (its tests are skipped).
      - name: Test dependencies for the prerelease
        if: matrix.version == 'pre'
        run: |
          julia -e 'using TOML; p = TOML.parsefile("Project.toml")
                    delete!(p["extras"], "DoubleFloats"); filter!(!=("DoubleFloats"), p["targets"]["test"])
                    open(io -> TOML.print(io, p), "Project.toml", "w")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
